version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: music-folder-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: music_folder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:z
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:z

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: music-folder-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DB_TYPE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=music_folder
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: music-folder-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - api

volumes:
  postgres_data:
