version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: music-folder-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: music-folder-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - api
