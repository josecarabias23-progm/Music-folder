version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: music-folder-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: music_folder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:z
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:z
    healthcheck:
      # La API no debe arrancar hasta que Postgres acepte conexiones.
      test: ["CMD-SHELL", "pg_isready -U postgres -d music_folder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: music-folder-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - JWT_SECRET=dev-secret-local-compose-change-me
      - DB_TYPE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=music_folder
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # `wget` viene en la base de Alpine (busybox) y no requiere instalar nada.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Vite resuelve VITE_API_URL en tiempo de build: como variable de runtime
      # no tiene efecto y el bundle apuntaba a la API de producción.
      args:
        VITE_API_URL: http://localhost:3001
    container_name: music-folder-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL: http://localhost:3001
      - PORT=5173
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
