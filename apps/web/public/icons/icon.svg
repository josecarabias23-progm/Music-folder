<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Ring Glow -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#folderGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <g filter="url(#shadow)" transform="translate(64, 74)">
    <!-- Folder Back -->
    <path d="M 40 40 L 160 40 L 200 80 L 344 80 C 366.09 80 384 97.91 384 120 L 384 300 C 384 322.09 366.09 340 344 340 L 40 340 C 17.91 340 0 322.09 0 300 L 0 80 C 0 57.91 17.91 40 40 40 Z" fill="#334155"/>
    
    <!-- Sheet Music Inside Folder -->
    <rect x="44" y="68" width="296" height="230" rx="12" fill="#f8fafc" opacity="0.95"/>
    <!-- Music Staves lines on sheet -->
    <line x1="84" y1="110" x2="300" y2="110" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="126" x2="300" y2="126" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="142" x2="300" y2="142" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="158" x2="300" y2="158" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="174" x2="300" y2="174" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <!-- Folder Front Cover (Gradient fill) -->
    <path d="M 0 110 L 140 110 L 175 135 L 344 135 C 366.09 135 384 152.91 384 175 L 384 310 C 384 332.09 366.09 350 344 350 L 40 350 C 17.91 350 0 332.09 0 310 Z" fill="url(#folderGrad)"/>

    <!-- Eighth Notes Emblem on Folder Cover -->
    <g transform="translate(140, 180) scale(1.3)">
      <!-- Note Stem 1 -->
      <rect x="22" y="16" width="6" height="38" rx="3" fill="#ffffff"/>
      <!-- Note Stem 2 -->
      <rect x="54" y="8" width="6" height="46" rx="3" fill="#ffffff"/>
      <!-- Beam -->
      <polygon points="22,16 60,8 60,18 22,26" fill="#ffffff"/>
      <!-- Note Head 1 -->
      <ellipse cx="14" cy="52" rx="12" ry="8.5" transform="rotate(-20 14 52)" fill="#ffffff"/>
      <!-- Note Head 2 -->
      <ellipse cx="46" cy="50" rx="12" ry="8.5" transform="rotate(-20 46 50)" fill="#ffffff"/>
    </g>
  </g>
</svg>
